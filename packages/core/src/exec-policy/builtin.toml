[[rule]]
prefix = ["sudo"]
effect = "deny"
reason = "privilege wrapper"

[[rule]]
prefix = ["doas"]
effect = "deny"
reason = "privilege wrapper"

[[rule]]
prefix = ["su"]
effect = "deny"
reason = "privilege wrapper"

[[rule]]
prefix = ["pkexec"]
effect = "deny"
reason = "privilege wrapper"

[[rule]]
prefix = ["mkfs"]
effect = "deny"
reason = "destructive"

[[rule]]
prefix = ["dd"]
effect = "deny"
reason = "destructive"

[[rule]]
prefix = ["shutdown"]
effect = "deny"
reason = "system"

[[rule]]
prefix = ["reboot"]
effect = "deny"
reason = "system"

[[rule]]
prefix = ["halt"]
effect = "deny"
reason = "system"

[[rule]]
prefix = ["poweroff"]
effect = "deny"
reason = "system"

[[rule]]
prefix = ["ls"]
effect = "allow"

[[rule]]
prefix = ["pwd"]
effect = "allow"

[[rule]]
prefix = ["echo"]
effect = "allow"

[[rule]]
prefix = ["true"]
effect = "allow"

[[rule]]
prefix = ["false"]
effect = "allow"

[[rule]]
prefix = ["printf"]
effect = "allow"

[[rule]]
prefix = ["git", "status"]
effect = "allow"

[[rule]]
prefix = ["git", "diff"]
effect = "allow"

[[rule]]
prefix = ["git", "log"]
effect = "allow"

[[rule]]
prefix = ["git", "rev-parse"]
effect = "allow"

[[rule]]
prefix = ["git", "branch", "-D"]
effect = "deny"
reason = "destructive git"

[[rule]]
prefix = ["git", "branch"]
effect = "allow"

[[rule]]
prefix = ["git", "remote", "-v"]
effect = "allow"

[[rule]]
prefix = ["git"]
effect = "ask"

[[rule]]
prefix = ["rg"]
effect = "allow"

[[rule]]
prefix = ["grep"]
effect = "allow"

[[rule]]
prefix = ["find"]
effect = "allow"

[[rule.match]]
argv = ["git", "status"]
expect = "allow"

[[rule.match]]
argv = ["sudo", "ls"]
expect = "deny"

[[rule.match]]
argv = ["rm", "-rf", "/"]
expect = "deny"

[[rule.match]]
argv = ["curl", "http://169.254.169.254/latest/meta-data"]
expect = "deny"

[[rule.not_match]]
argv = ["git", "status"]
prefix = ["git", "reset", "--hard"]
